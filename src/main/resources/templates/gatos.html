<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cat Daycare</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

 //// CADASTRA UM GATO

<h1>Cadastrar Gato</h1>

 <form action="#" th:action="@{/gatos}" th:object="${gato}" method="post" class="needs-validation" novalidate>
   <div class="mb-3">
     <label for="nome" class="form-label">Nome:</label>
     <input type="text" th:field="*{nome}" class="form-control" id="nome" required />
   </div>

  <label>Dono:</label>
  <select th:field="*{dono}">
    <option value="" disabled selected>Selecione o dono</option>
    <option th:each="d : ${donos}" th:value="${d.id}" th:text="${d.nome}"></option>
  </select>
  <div th:if="${#fields.hasErrors('dono')}" th:errors="*{dono}"></div>

  <button type="submit">Salvar</button>
</form>

// LISTA DE GATOS
<h1 class="mb-4">Lista de Gatos</h1>

<a href="/gatos/novo" class="btn btn-primary mb-3">Novo Gato</a>

<table class="table table-bordered table-striped">
  <thead class="table-dark">
  <tr>
    <th>Nome</th>
    <th>Raça</th>
    <th>Idade</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="gato : ${gatos}">
    <td th:text="${gato.nome}">Nome</td>
    <td th:text="${gato.raca}">Raça</td>
    <td th:text="${gato.idade}">Idade</td>
  </tr>
  </tbody>
</table>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

</body>
</html>
