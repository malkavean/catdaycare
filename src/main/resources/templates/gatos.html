<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cat Daycare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5">

    <!-- FORMULÁRIO PARA CADASTRAR GATO -->
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h2 class="text-center mb-4">Cadastrar Gato</h2>

            <form th:action="@{/gatos}" th:object="${gato}" method="post" class="needs-validation mb-5" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" th:field="*{nome}" class="form-control" id="nome" required />
                </div>

                <div class="mb-3">
                    <label for="raca" class="form-label">Raça:</label>
                    <input type="text" th:field="*{raca}" class="form-control" id="raca" />
                </div>

                <div class="mb-3">
                    <label for="cor" class="form-label">Cor:</label>
                    <input type="text" th:field="*{cor}" class="form-control" id="cor" />
                </div>

                <div class="mb-3">
                    <label for="idade" class="form-label">Idade:</label>
                    <input type="number" th:field="*{idade}" class="form-control" id="idade" min="0" />
                </div>

                <div class="mb-3">
                    <label for="sexo" class="form-label">Sexo:</label>
                    <select th:field="*{sexo}" class="form-select" id="sexo">
                        <option value="" disabled selected>Selecione o sexo</option>
                        <option value="Macho">Macho</option>
                        <option value="Fêmea">Fêmea</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="dono" class="form-label">Dono:</label>
                    <select th:field="*{dono}" class="form-select" id="dono">
                        <option value="" disabled selected>Selecione o dono</option>
                        <option th:each="d : ${donos}" th:value="${d.id}" th:text="${d.nome}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('dono')}" th:errors="*{dono}" class="text-danger"></div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Salvar</button>
                </div>
            </form>

        </div>
    </div>

    <!-- LISTA DE GATOS -->
    <div class="row justify-content-center">
        <div class="col-md-10">

            <h2 class="text-center mb-3">Lista de Gatos</h2>

            <table class="table table-bordered table-striped text-center">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Raça</th>
                    <th>Cor</th>
                    <th>Idade</th>
                    <th>Sexo</th>
                    <th>Dono</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="gato : ${gatos}">
                    <td th:text="${gato.nome}">Nome</td>
                    <td th:text="${gato.raca}">Raça</td>
                    <td th:text="${gato.cor}">Cor</td>
                    <td th:text="${gato.idade}">Idade</td>
                    <td th:text="${gato.sexo}">Sexo</td>
                    <td th:text="${gato.dono.nome}">Dono</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
