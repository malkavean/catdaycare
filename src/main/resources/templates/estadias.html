<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cat Daycare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5">

  <div class="row justify-content-center">
    <div class="col-md-8">

      <h2 class="text-center mb-4">Estadias</h2>

      <div class="text-center mb-3">
        <a href="/estadias/nova" class="btn btn-primary">Nova Estadia</a>
      </div>

      <table class="table table-bordered table-striped text-center">
        <thead class="table-dark">
        <tr>
          <th>Gato</th>
          <th>Entrada</th>
          <th>Saída</th>
          <th>Preço</th> <!-- Cabeçalho adicionado -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="estadia : ${estadias}">
          <td th:text="${estadia.gato.nome}">Gato</td>
          <td th:text="${estadia.dataEntrada}">Entrada</td>
          <td th:text="${estadia.dataSaida}">Saída</td>
          <td th:text="${estadia.preco}">Preço</td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
