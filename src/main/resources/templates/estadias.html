<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cat Daycare</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<body>
<h1>Estadias</h1>
<a href="/estadias/nova">Nova Estadia</a>
<table>
  <tr>
    <th>Gato</th>
    <th>Entrada</th>
    <th>Saida</th>
  </tr>
  <tr th:each="estadia : ${estadias}">
    <td th:text="${estadia.gato.nome}">Gato</td>
    <td th:text="${estadia.dataEntrada}">Entrada</td>
    <td th:text="${estadia.dataSaida}">Saida</td>
  </tr>
</table>
<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

</body>
</html>
