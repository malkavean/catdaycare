<!-- src/main/resources/templates/donos.html --><!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cat Daycare</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<body>
<h1>Cadastro de Dono</h1>

<form action="#" th:action="@{/donos}" th:object="${dono}" method="post">
    <label>Nome: <input type="text" th:field="*{nome}"/></label><br>
    <label>Telefone: <input type="text" th:field="*{telefone}"/></label><br>
    <button type="submit">Cadastrar</button>
</form>

<h2>Donos Cadastrados</h2>
<ul>
    <li th:each="d : ${donos}">
        <span th:text="${d.nome}"></span> - <span th:text="${d.telefone}"></span>
    </li>
</ul>
<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

</body>
</html>
