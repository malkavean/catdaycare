<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cat Daycare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5">

    <!-- FORMULÁRIO DE CADASTRO -->
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="text-center mb-4">Cadastro de Dono</h2>

            <form th:action="@{/donos}" th:object="${dono}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" th:field="*{nome}" id="nome" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="text" th:field="*{telefone}" id="telefone" class="form-control" />
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-success px-4">Cadastrar</button>
                </div>
            </form>

        </div>
    </div>

    <!-- LISTA DE DONOS -->
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <h3 class="text-center mb-3">Donos Cadastrados</h3>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center"
                    th:each="d : ${donos}">
          <span>
            <strong th:text="${d.nome}">Nome</strong> -
            <span th:text="${d.telefone}">Telefone</span>
          </span>
                </li>
            </ul>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
