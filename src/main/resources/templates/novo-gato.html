<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Novo Gato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Cadastrar Gato</h2>

<form th:action="@{/gatos}" th:object="${gato}" method="post" class="mt-4">
  <div class="mb-3">
    <label for="nome" class="form-label">Nome:</label>
    <input type="text" th:field="*{nome}" id="nome" class="form-control"/>
  </div>
  <div class="mb-3">
    <label for="raca" class="form-label">Raça:</label>
    <input type="text" th:field="*{raca}" id="raca" class="form-control"/>
  </div>
  <div class="mb-3">
    <label for="idade" class="form-label">Idade:</label>
    <input type="number" th:field="*{idade}" id="idade" class="form-control"/>
  </div>
  <button type="submit" class="btn btn-success">Salvar</button>
  <a href="/gatos" class="btn btn-secondary ms-2">Cancelar</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
