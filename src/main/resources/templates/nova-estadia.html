<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cat Daycare</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<body>
<h1>Nova Estadia</h1>
<form action="#" th:action="@{/estadias}" th:object="${estadia}" method="post">
  <label>Gato:</label>
  <select th:field="*{gato.id}">
    <option th:each="gato : ${gatos}"
            th:value="${gato.id}"
            th:text="${gato.nome}">
    </option>
  </select><br>
  <label>Data de Entrada:</label>
  <input type="date" th:field="*{dataEntrada}"/><br>
  <label>Data de Saída:</label>
  <input type="date" th:field="*{dataSaida}"/><br>
  <button type="submit">Salvar</button>
</form>

<a href="/estadias">Voltar</a>
<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

</body>
</html>
